<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d6872">
  <meta name="description" content="円上の点Pを動かし、角度ごとの3つの値と半径の比を視覚的に確かめる学習教材です。">
  <title>三角関数ラボ｜円を動かして学ぼう</title>
  <style>
    :root {
      --navy: #14243a;
      --ink: #22344d;
      --muted: #607189;
      --teal-900: #075a63;
      --teal-700: #087681;
      --teal-600: #0b8991;
      --teal-100: #dff5f3;
      --teal-50: #eefaf8;
      --orange: #ef7a43;
      --orange-100: #fff0e8;
      --blue: #3777d6;
      --blue-100: #eaf2ff;
      --yellow: #f2b84b;
      --yellow-100: #fff7d9;
      --green: #198754;
      --green-100: #e8f7ef;
      --red: #cb3a4e;
      --red-100: #fdecef;
      --line: #d9e3ee;
      --panel: #ffffff;
      --page: #f4f7fb;
      --shadow: 0 16px 42px rgba(24, 47, 78, .09);
      --radius-lg: 26px;
      --radius-md: 18px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      min-width: 320px;
      background:
        radial-gradient(circle at 8% 0%, rgba(11, 137, 145, .09), transparent 28rem),
        radial-gradient(circle at 94% 12%, rgba(239, 122, 67, .08), transparent 24rem),
        var(--page);
      color: var(--ink);
      font-family: "Hiragino Sans", "Yu Gothic UI", "Yu Gothic", "Noto Sans JP", sans-serif;
      line-height: 1.65;
    }

    button,
    input {
      font: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    button:focus-visible,
    input:focus-visible,
    [tabindex]:focus-visible {
      outline: 4px solid rgba(55, 119, 214, .25);
      outline-offset: 3px;
    }

    .site-header {
      padding: calc(24px + env(safe-area-inset-top)) 20px 20px;
    }

    .header-inner,
    .page-shell {
      width: min(1180px, 100%);
      margin-inline: auto;
    }

    .header-inner {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
    }

    .brand-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      border-radius: 14px;
      color: white;
      background: var(--teal-700);
      box-shadow: 0 8px 20px rgba(8, 118, 129, .22);
    }

    .brand-mark svg {
      width: 27px;
      height: 27px;
    }

    .eyebrow {
      margin: 0;
      color: var(--teal-700);
      font-size: .78rem;
      font-weight: 900;
      letter-spacing: .14em;
    }

    h1 {
      margin: 0;
      color: var(--navy);
      font-size: clamp(1.7rem, 5vw, 2.85rem);
      line-height: 1.22;
      letter-spacing: -.04em;
    }

    .text-chunk {
      display: inline-block;
    }

    .math-expression {
      display: inline-block;
      color: inherit;
      font-family: "STIX Two Math", "Cambria Math", "Times New Roman", serif;
      font-size: 1.04em;
      font-weight: inherit;
      white-space: nowrap;
    }

    .math-expression var,
    .coordinate-card .symbol var {
      color: inherit;
      font-family: inherit;
      font-style: italic;
      font-weight: inherit;
    }

    .math-axis-label {
      font-family: "STIX Two Math", "Cambria Math", "Times New Roman", serif;
      font-style: italic;
    }

    .header-copy {
      margin: 9px 0 0;
      color: var(--muted);
      font-size: .98rem;
    }

    .header-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      flex-wrap: wrap;
    }

    .angle-unit-toggle {
      display: inline-flex;
      gap: 3px;
      padding: 3px;
      border: 1px solid #c8d8e6;
      border-radius: 999px;
      background: rgba(255, 255, 255, .82);
      box-shadow: 0 6px 18px rgba(24, 47, 78, .06);
    }

    .angle-unit-button {
      min-height: 36px;
      padding: 7px 12px;
      border: 0;
      border-radius: 999px;
      color: #50657b;
      background: transparent;
      font-size: .78rem;
      font-weight: 900;
      white-space: nowrap;
      cursor: pointer;
      transition: color .18s ease, background .18s ease, box-shadow .18s ease;
    }

    .angle-unit-button:hover {
      color: var(--teal-900);
      background: var(--teal-50);
    }

    .angle-unit-button.active {
      color: white;
      background: var(--teal-700);
      box-shadow: 0 5px 12px rgba(8, 118, 129, .22);
    }

    .radian-value {
      font-family: "STIX Two Math", "Cambria Math", "Times New Roman", serif;
    }

    .save-status {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 13px;
      border: 1px solid #cce9e5;
      border-radius: 999px;
      color: var(--teal-900);
      background: rgba(238, 250, 248, .82);
      font-size: .78rem;
      font-weight: 800;
      white-space: nowrap;
    }

    .save-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #21a36b;
      box-shadow: 0 0 0 4px rgba(33, 163, 107, .12);
    }

    .page-shell {
      padding: 4px 20px calc(56px + env(safe-area-inset-bottom));
    }

    .learning-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.08fr) minmax(340px, .92fr);
      gap: 20px;
      align-items: start;
    }

    .panel {
      border: 1px solid rgba(207, 220, 234, .9);
      border-radius: var(--radius-lg);
      background: rgba(255, 255, 255, .95);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .panel-pad {
      padding: clamp(18px, 3vw, 28px);
    }

    .section-heading {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 18px;
    }

    .step-badge {
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      min-width: 62px;
      height: 30px;
      margin-top: 2px;
      border-radius: 999px;
      color: var(--teal-900);
      background: var(--teal-100);
      font-size: .74rem;
      font-weight: 900;
      letter-spacing: .08em;
    }

    .section-heading h2 {
      margin: 0;
      color: var(--navy);
      font-size: clamp(1.12rem, 3vw, 1.42rem);
      line-height: 1.4;
    }

    .section-heading p {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: .86rem;
    }

    .circle-stage {
      position: relative;
      display: grid;
      place-items: center;
      aspect-ratio: 1 / 1;
      width: min(100%, 560px);
      margin-inline: auto;
      border: 1px solid #dce8f1;
      border-radius: 22px;
      background:
        linear-gradient(rgba(255,255,255,.82), rgba(255,255,255,.82)),
        linear-gradient(90deg, rgba(8,118,129,.06) 1px, transparent 1px),
        linear-gradient(rgba(8,118,129,.06) 1px, transparent 1px);
      background-size: auto, 24px 24px, 24px 24px;
      overflow: hidden;
      touch-action: none;
      user-select: none;
    }

    #circleSvg {
      display: block;
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .axis {
      stroke: #8ea0b5;
      stroke-width: 2;
    }

    .axis-arrow {
      fill: #8ea0b5;
    }

    .axis-label {
      fill: #53657b;
      font-size: 18px;
      font-weight: 800;
    }

    .unit-circle {
      fill: rgba(223, 245, 243, .32);
      stroke: var(--teal-600);
      stroke-width: 4;
    }

    .angle-arc {
      fill: none;
      stroke: var(--orange);
      stroke-linecap: round;
      stroke-width: 6;
    }

    .angle-label {
      fill: #c35427;
      font-size: 17px;
      font-weight: 900;
      text-anchor: middle;
    }

    .triangle-fill {
      fill: rgba(55, 119, 214, .12);
    }

    .triangle-side {
      fill: none;
      stroke: var(--blue);
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 4;
    }

    .radius-side {
      stroke: var(--orange);
    }

    .right-angle {
      fill: none;
      stroke: var(--blue);
      stroke-width: 3;
    }

    .point-guide {
      stroke: #8bbad1;
      stroke-width: 2;
      stroke-dasharray: 7 7;
    }

    .origin-point {
      fill: var(--navy);
    }

    .point-halo {
      fill: rgba(239, 122, 67, .16);
      animation: breathe 2s ease-in-out infinite;
    }

    .point-main {
      fill: var(--orange);
      stroke: white;
      stroke-width: 5;
      filter: drop-shadow(0 5px 8px rgba(155, 70, 31, .28));
      cursor: grab;
    }

    .point-main:active {
      cursor: grabbing;
    }

    .point-label {
      fill: var(--navy);
      font-size: 18px;
      font-weight: 900;
      paint-order: stroke;
      stroke: white;
      stroke-width: 5px;
      stroke-linejoin: round;
    }

    .ratio-badge circle {
      fill: white;
      stroke-width: 3;
      filter: drop-shadow(0 3px 5px rgba(24, 47, 78, .13));
    }

    .ratio-badge text {
      font-size: 16px;
      font-weight: 900;
      text-anchor: middle;
      dominant-baseline: central;
    }

    .ratio-badge.horizontal circle,
    .ratio-badge.vertical circle {
      stroke: var(--blue);
    }

    .ratio-badge.horizontal text,
    .ratio-badge.vertical text {
      fill: #285da9;
    }

    .ratio-badge.radius circle {
      stroke: var(--orange);
    }

    .ratio-badge.radius text {
      fill: #c35427;
    }

    .axis-note {
      position: absolute;
      left: 50%;
      bottom: 16px;
      translate: -50% 0;
      width: max-content;
      max-width: calc(100% - 24px);
      padding: 8px 12px;
      border: 1px solid #f1dda1;
      border-radius: 12px;
      color: #6c5216;
      background: rgba(255, 248, 218, .95);
      box-shadow: 0 6px 18px rgba(87, 68, 18, .08);
      font-size: .76rem;
      font-weight: 800;
      text-align: center;
    }

    .drag-hint {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin: 12px 0 0;
      color: var(--muted);
      font-size: .8rem;
      font-weight: 700;
    }

    .drag-hint svg {
      width: 18px;
      height: 18px;
      color: var(--teal-700);
    }

    .angle-selector {
      display: flex;
      gap: 8px;
      margin-top: 16px;
      padding: 3px 1px 7px;
      overflow-x: auto;
      overscroll-behavior-inline: contain;
      scrollbar-color: #aac9cf transparent;
      scroll-snap-type: x proximity;
    }

    .angle-chip {
      flex: 0 0 auto;
      min-width: 56px;
      min-height: 44px;
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 13px;
      color: #40546d;
      background: #f9fbfd;
      font-weight: 900;
      cursor: pointer;
      scroll-snap-align: start;
      transition: transform .16s ease, color .16s ease, background .16s ease, border-color .16s ease;
    }

    .angle-chip:hover {
      border-color: #93c8c8;
      transform: translateY(-1px);
    }

    .angle-chip.active {
      border-color: var(--teal-700);
      color: white;
      background: var(--teal-700);
      box-shadow: 0 6px 14px rgba(8, 118, 129, .2);
    }

    .current-angle-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 17px 18px;
      border: 1px solid #cce8e5;
      border-radius: 18px;
      background: linear-gradient(135deg, #effbf9, #f8fdfd);
    }

    .current-angle-card span {
      color: var(--teal-900);
      font-size: .78rem;
      font-weight: 900;
      letter-spacing: .08em;
    }

    .current-angle-card strong {
      color: var(--teal-900);
      font-size: clamp(2rem, 7vw, 3.15rem);
      line-height: 1;
      letter-spacing: -.04em;
    }

    .value-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin: 20px 0 10px;
    }

    .value-heading h3,
    .definition-block h3,
    .practice-block h3 {
      margin: 0;
      color: var(--navy);
      font-size: 1rem;
    }

    .value-heading small {
      color: var(--muted);
      font-size: .75rem;
      font-weight: 700;
    }

    .coordinate-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 9px;
    }

    .coordinate-card {
      min-width: 0;
      padding: 13px 10px 12px;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: #fbfcfe;
      text-align: center;
    }

    .coordinate-card .symbol {
      display: inline-grid;
      place-items: center;
      width: 28px;
      height: 28px;
      margin-bottom: 7px;
      border-radius: 9px;
      color: white;
      background: var(--blue);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1rem;
      font-style: italic;
      font-weight: 800;
    }

    .coordinate-card:nth-child(2) .symbol {
      background: var(--teal-700);
    }

    .coordinate-card:nth-child(3) .symbol {
      background: var(--orange);
    }

    .coordinate-card strong {
      display: block;
      min-height: 1.65em;
      color: var(--navy);
      font-family: "Hiragino Sans", "Yu Gothic UI", sans-serif;
      font-size: clamp(.82rem, 2.4vw, 1rem);
      line-height: 1.4;
      overflow-wrap: anywhere;
    }

    .definition-block {
      margin-top: 20px;
    }

    .definition-list {
      display: grid;
      gap: 8px;
      margin-top: 10px;
    }

    .definition-row {
      display: grid;
      grid-template-columns: 64px 1fr auto;
      align-items: center;
      gap: 10px;
      min-height: 52px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #fbfcfe;
    }

    .definition-row .function-name {
      color: var(--navy);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.05rem;
      font-weight: 800;
    }

    .definition-row .formula {
      color: #43566e;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.03rem;
      font-weight: 700;
    }

    .definition-row .substitution {
      color: var(--teal-900);
      font-size: .78rem;
      font-weight: 900;
      text-align: right;
    }

    .practice-block {
      margin-top: 21px;
      padding-top: 20px;
      border-top: 1px dashed #cbd9e7;
    }

    .practice-lead {
      margin: 4px 0 12px;
      color: var(--muted);
      font-size: .8rem;
    }

    .current-inputs {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 9px;
    }

    .answer-field {
      position: relative;
      min-width: 0;
    }

    .answer-field label {
      display: block;
      margin: 0 0 5px 2px;
      color: #43566e;
      font-family: Georgia, "Times New Roman", serif;
      font-size: .8rem;
      font-weight: 800;
    }

    .answer-input {
      width: 100%;
      min-height: 48px;
      padding: 10px 32px 10px 10px;
      border: 2px solid #d8e2ec;
      border-radius: 13px;
      color: var(--navy);
      background: white;
      font-size: .9rem;
      font-weight: 800;
      text-align: center;
      transition: border-color .15s ease, background .15s ease;
    }

    .answer-input::placeholder {
      color: #9aa9ba;
      font-weight: 600;
    }

    .answer-input:hover {
      border-color: #a9c3d9;
    }

    .answer-field.correct .answer-input,
    .table-answer.correct {
      border-color: var(--green);
      background: var(--green-100);
    }

    .answer-field.wrong .answer-input,
    .table-answer.wrong {
      border-color: var(--red);
      background: var(--red-100);
    }

    .answer-mark {
      position: absolute;
      right: 9px;
      bottom: 12px;
      display: none;
      font-size: .95rem;
      font-weight: 900;
    }

    .answer-field.correct .answer-mark {
      display: block;
      color: var(--green);
    }

    .answer-field.wrong .answer-mark {
      display: block;
      color: var(--red);
    }

    .mini-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 44px;
      padding: 10px 15px;
      border: 1px solid transparent;
      border-radius: 13px;
      font-size: .82rem;
      font-weight: 900;
      cursor: pointer;
      transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
    }

    .btn-primary {
      color: white;
      background: var(--teal-700);
      box-shadow: 0 7px 16px rgba(8, 118, 129, .18);
    }

    .btn-primary:hover {
      background: var(--teal-900);
    }

    .btn-secondary {
      border-color: var(--line);
      color: #40546d;
      background: white;
    }

    .btn-secondary:hover {
      background: #f4f8fb;
    }

    .btn-danger {
      border-color: #f1c6cd;
      color: #a82e41;
      background: #fff8f9;
    }

    .hint-box {
      display: none;
      margin-top: 12px;
      padding: 11px 13px;
      border: 1px solid #f0d88f;
      border-radius: 13px;
      color: #664e16;
      background: var(--yellow-100);
      font-size: .79rem;
      font-weight: 700;
    }

    .hint-box.show {
      display: block;
      animation: lift-in .22s ease both;
    }

    .table-panel {
      margin-top: 20px;
    }

    .table-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
    }

    .progress-wrap {
      flex: 0 0 220px;
      padding: 11px 13px;
      border: 1px solid #dce6ef;
      border-radius: 15px;
      background: #f9fbfd;
    }

    .progress-copy {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 7px;
      color: var(--muted);
      font-size: .76rem;
      font-weight: 800;
    }

    .progress-copy strong {
      color: var(--teal-900);
    }

    .progress-track {
      height: 8px;
      border-radius: 999px;
      background: #dfe9ee;
      overflow: hidden;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--teal-600), #4ab9a8);
      transition: width .25s ease;
    }

    .table-scroll {
      margin-top: 4px;
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: white;
      overscroll-behavior-inline: contain;
    }

    .trig-table {
      width: 100%;
      min-width: 650px;
      border-collapse: separate;
      border-spacing: 0;
      font-size: .88rem;
    }

    .trig-table th,
    .trig-table td {
      padding: 10px;
      border-right: 1px solid #e2e9f0;
      border-bottom: 1px solid #e2e9f0;
      text-align: center;
    }

    .trig-table tr:last-child td {
      border-bottom: 0;
    }

    .trig-table th:last-child,
    .trig-table td:last-child {
      border-right: 0;
    }

    .trig-table thead th {
      position: sticky;
      top: 0;
      z-index: 2;
      color: white;
      background: var(--navy);
      font-family: Georgia, "Times New Roman", serif;
      font-size: .95rem;
    }

    .trig-table thead th:first-child {
      width: 90px;
      font-family: inherit;
    }

    .trig-table tbody tr {
      background: white;
      transition: background .16s ease;
    }

    .trig-table tbody tr:nth-child(even) {
      background: #f9fbfd;
    }

    .trig-table tbody tr.current-row {
      background: #eefaf8;
      box-shadow: inset 5px 0 0 var(--teal-600);
    }

    .angle-cell button {
      min-width: 60px;
      min-height: 42px;
      border: 0;
      border-radius: 12px;
      color: var(--teal-900);
      background: var(--teal-100);
      font-weight: 900;
      cursor: pointer;
    }

    .current-row .angle-cell button {
      color: white;
      background: var(--teal-700);
    }

    .table-answer {
      width: min(100%, 165px);
      min-height: 42px;
      padding: 8px 10px;
      border: 2px solid #d9e3ec;
      border-radius: 11px;
      color: var(--navy);
      background: white;
      font-weight: 800;
      text-align: center;
    }

    .table-tools {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-top: 16px;
    }

    .table-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
    }

    .check-message {
      min-height: 1.5em;
      margin: 0;
      color: var(--muted);
      font-size: .84rem;
      font-weight: 800;
      text-align: right;
    }

        225: { x: "−√2r / 2",  y: "−√2r / 2",   sin: "−√2/2",   cos: "−√2/2",    tan: "1" },
        240: { x: "−r / 2",    y: "−√3r / 2",   sin: "−√3/2",   cos: "−1/2",     tan: "√3" },

      function loadAnswers() {
        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
          return saved && typeof saved === "object" ? saved : {};
        } catch {
          return {};
        }
      }

      function saveAnswers() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(answers));

          // The exercise still works if browser storage is unavailable.

      function key(angle, fn) {
        return `${angle}-${fn}`;

      function displayCompact(value) {
        return value.replaceAll(" ", "");
      }

      function normalize(value) {
        let text = String(value ?? "")
          .trim()
          .toLowerCase()
          .replace(/[ 　]/g, "")
          .replace(/[−–—]/g, "-")
          .replace(/[／÷]/g, "/")
          .replace(/[（]/g, "(")
          .replace(/[）]/g, ")")
          .replace(/sqrt\s*\(\s*([23])\s*\)/g, "√$1")
          .replace(/sqrt([23])/g, "√$1")
          .replace(/√\(([23])\)/g, "√$1")
          .replace(/^\+/, "");

        if (["undefined", "undef", "なし", "定義されない", "×", "x"].includes(text)) {
          text = "定義なし";
        }
        return text;
      }

      function acceptedValues(answer) {
        const canonical = normalize(answer);
        const values = new Set([canonical]);
        const negative = canonical.startsWith("-");
        const unsigned = negative ? canonical.slice(1) : canonical;
        const prefix = negative ? "-" : "";

        if (unsigned === "√3/3") {
          values.add(`${prefix}1/√3`);
          values.add(`${prefix}√3/√9`);
        }
        if (unsigned === "√2/2") {
          values.add(`${prefix}1/√2`);
        }
        return values;
      }

      function isCorrect(angle, fn, value) {
        return acceptedValues(DATA[angle][fn]).has(normalize(value));
      }

      function ratioFor(angle) {
        const normalized = ((angle % 360) + 360) % 360;
        const cosAbs = Math.abs(Math.cos(normalized * Math.PI / 180));
        const sinAbs = Math.abs(Math.sin(normalized * Math.PI / 180));
        if (cosAbs < .001 || sinAbs < .001) return null;
        if (Math.abs(cosAbs - sinAbs) < .001) return { x: "1", y: "1", r: "√2" };
        if (cosAbs > sinAbs) return { x: "√3", y: "1", r: "2" };
        return { x: "1", y: "√3", r: "2" };
      }

      }

      function updateAngleUnitControls() {
        document.body.dataset.angleUnit = angleUnit;
        el.angleUnitButtons.forEach(button => {
          const isActive = button.dataset.angleUnit === angleUnit;
          button.classList.toggle("active", isActive);
          button.setAttribute("aria-pressed", String(isActive));
        });
        el.angleRangeStatus.title = angleUnit === "radian"
          ? "0から2πまで、17の代表角を確認できます"
          : "0°から360°まで、17の代表角を確認できます";
      }

      function setAngleUnit(unit) {
        if (unit !== "degree" && unit !== "radian") return;
        angleUnit = unit;
        updateAngleUnitControls();
        renderAngleSelector();
        updateRatioDisplay();
        updateDiagram();
      }

      function renderAngleSelector() {
        el.angleSelector.innerHTML = "";
        ANGLES.forEach(angle => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = `angle-chip${angle === currentAngle ? " active" : ""}${angleUnit === "radian" ? " radian-value" : ""}`;
          button.textContent = angleText(angle);
          button.setAttribute("aria-label", `${angleSpeech(angle)}を選ぶ`);
          button.setAttribute("aria-pressed", String(angle === currentAngle));
          button.addEventListener("click", () => setAngle(angle, true));
          el.angleSelector.appendChild(button);
        });
      }

      function renderTable() {
        el.tableBody.innerHTML = "";
        ANGLES.forEach(angle => {
          const tr = document.createElement("tr");
          tr.dataset.angle = angle;
          if (angle === currentAngle) tr.classList.add("current-row");

          const angleTd = document.createElement("td");
          angleTd.className = "angle-cell";
          const angleButton = document.createElement("button");
          angleButton.type = "button";
          angleButton.textContent = angleText(angle);
          angleButton.classList.toggle("radian-value", angleUnit === "radian");
          angleButton.setAttribute("aria-label", `${angleSpeech(angle)}を図に表示`);
          angleButton.addEventListener("click", () => {
            setAngle(angle, true);
            document.querySelector(".learning-grid").scrollIntoView({ behavior: "smooth", block: "start" });
          });
          angleTd.appendChild(angleButton);
          tr.appendChild(angleTd);

          FUNCTIONS.forEach(fn => {
            const td = document.createElement("td");
            const input = document.createElement("input");
            const answerKey = key(angle, fn);
            input.className = "table-answer";
            input.type = "text";
            input.value = answers[answerKey] || "";
            input.placeholder = fn === "tan" && (angle === 90 || angle === 270) ? "定義なし" : "入力";
            input.autocomplete = "off";
            input.spellcheck = false;
            input.setAttribute("aria-label", `${angleSpeech(angle)}の${fn}の値`);
            applyCheckClass(input, checked[answerKey]);
            input.addEventListener("input", event => updateAnswer(angle, fn, event.target.value, "table"));
            td.appendChild(input);
            tr.appendChild(td);
          });
          el.tableBody.appendChild(tr);
        });
      }

      function renderCurrentInputs() {
        el.currentInputs.innerHTML = "";
        FUNCTIONS.forEach(fn => {
          const wrapper = document.createElement("div");
          const answerKey = key(currentAngle, fn);
          wrapper.className = "answer-field";
          applyCheckClass(wrapper, checked[answerKey]);

          const label = document.createElement("label");
          const inputId = `current-${fn}`;
          label.htmlFor = inputId;
          label.textContent = `${fn} θ`;

          const input = document.createElement("input");
          input.id = inputId;
          input.className = "answer-input";
          input.type = "text";
          input.value = answers[answerKey] || "";
          input.placeholder = "?";
          input.autocomplete = "off";
          input.spellcheck = false;
          input.addEventListener("input", event => updateAnswer(currentAngle, fn, event.target.value, "current"));

          const mark = document.createElement("span");
          mark.className = "answer-mark";
          mark.textContent = checked[answerKey] === true ? "✓" : "!";
          mark.setAttribute("aria-hidden", "true");

          wrapper.append(label, input, mark);
          el.currentInputs.appendChild(wrapper);
        });
      }

      function applyCheckClass(element, state) {
        element.classList.remove("correct", "wrong");
        if (state === true) element.classList.add("correct");
        if (state === false) element.classList.add("wrong");
      }

      function updateAnswer(angle, fn, value, source) {
        const answerKey = key(angle, fn);
        answers[answerKey] = value;
        delete checked[answerKey];
        saveAnswers();
        updateProgress();

        if (source === "table" && angle === currentAngle) {
          const currentInput = document.getElementById(`current-${fn}`);
          if (currentInput && currentInput.value !== value) currentInput.value = value;
          const wrapper = currentInput?.closest(".answer-field");
          if (wrapper) applyCheckClass(wrapper, undefined);
        }

        if (source === "current") {
          const row = el.tableBody.querySelector(`tr[data-angle="${angle}"]`);
          const tableInput = row?.querySelectorAll(".table-answer")[FUNCTIONS.indexOf(fn)];
          if (tableInput && tableInput.value !== value) tableInput.value = value;
          if (tableInput) applyCheckClass(tableInput, undefined);
        }
      }

      function updateProgress() {
        const total = ANGLES.length * FUNCTIONS.length;
        const count = ANGLES.reduce((sum, angle) => (
          sum + FUNCTIONS.filter(fn => normalize(answers[key(angle, fn)] || "") !== "").length
        ), 0);
        el.progressText.textContent = `${count} / ${total}`;
        el.progressBar.style.width = `${count / total * 100}%`;
      }

      function substitution(value) {
        if (value === "0" || value === "r" || value === "−r") return value;
        return displayCompact(value);
      }

      function updateRatioDisplay() {
        const ratio = RATIOS[currentAngle];
        el.currentAngle.textContent = angleText(currentAngle);
        el.currentAngle.classList.toggle("radian-value", angleUnit === "radian");
        el.xValue.textContent = ratio.x;
        el.yValue.textContent = ratio.y;
        el.rValue.textContent = ratio.r;
      }

      function setSvgPoint(element, x, y) {
        element.setAttribute("cx", x);
        element.setAttribute("cy", y);
      }

      function setLine(element, x1, y1, x2, y2) {
        element.setAttribute("x1", x1);
        element.setAttribute("y1", y1);
        element.setAttribute("x2", x2);
        element.setAttribute("y2", y2);
      }

      function polarPoint(radius, angle) {
        const rad = angle * Math.PI / 180;
        return {
          x: CENTER + radius * Math.cos(rad),
          y: CENTER - radius * Math.sin(rad)
        };
      }

      function arcPath(angle) {
        const normalized = angle === 360 ? 359.99 : angle;
        if (normalized === 0) return "";
        const arcRadius = 49;
        const start = polarPoint(arcRadius, 0);
        const end = polarPoint(arcRadius, normalized);
        const largeArc = normalized > 180 ? 1 : 0;
        return `M ${start.x} ${start.y} A ${arcRadius} ${arcRadius} 0 ${largeArc} 0 ${end.x} ${end.y}`;
      }

      function setBadge(group, x, y, value) {
        group.setAttribute("transform", `translate(${x} ${y})`);
        group.querySelector("text").textContent = value;
        const circle = group.querySelector("circle");
        const badgeRadius = value.includes("√") ? 23 : 20;
        circle.setAttribute("r", badgeRadius);
      }

      function updateDiagram() {
        const visualAngle = currentAngle === 360 ? 0 : currentAngle;
        const rad = visualAngle * Math.PI / 180;
        const px = CENTER + RADIUS * Math.cos(rad);
        const py = CENTER - RADIUS * Math.sin(rad);
        const footX = px;
        const footY = CENTER;
        const ratio = ratioFor(currentAngle);
        const hasTriangle = ratio !== null;

        setSvgPoint(el.pointP, px, py);
        setSvgPoint(el.pointHalo, px, py);
        el.pointGroup.setAttribute("aria-valuenow", currentAngle);
        el.pointGroup.setAttribute("aria-valuetext", `${angleSpeech(currentAngle)}。左右の矢印キーでも動かせます。`);
        el.pointLabel.setAttribute("x", px + (px >= CENTER ? 17 : -31));
        el.pointLabel.setAttribute("y", py + (py <= CENTER ? -17 : 29));

        setLine(el.radiusSide, CENTER, CENTER, px, py);
        setLine(el.pointGuide, px, py, px, CENTER);
        el.pointGuide.style.display = hasTriangle ? "" : "none";

        el.angleArc.setAttribute("d", arcPath(currentAngle));
        const arcLabelAngle = currentAngle === 360 ? 330 : Math.max(12, Math.min(currentAngle / 2, 330));
        const angleLabelPoint = polarPoint(76, arcLabelAngle);
        el.angleArcLabel.setAttribute("x", angleLabelPoint.x);
        el.angleArcLabel.setAttribute("y", angleLabelPoint.y + 5);
        el.angleArcLabel.textContent = angleText(currentAngle);
        el.angleArcLabel.classList.toggle("radian-value", angleUnit === "radian");

        el.axisNote.hidden = hasTriangle;
        [el.triangleFill, el.horizontalSide, el.verticalSide, el.rightAngle,
          el.horizontalBadge, el.verticalBadge, el.radiusBadge].forEach(node => {
            node.style.display = hasTriangle ? "" : "none";
          });

        if (!hasTriangle) return;

        el.triangleFill.setAttribute("d", `M ${CENTER} ${CENTER} L ${px} ${CENTER} L ${px} ${py} Z`);
        setLine(el.horizontalSide, CENTER, CENTER, footX, footY);
        setLine(el.verticalSide, footX, footY, px, py);

        const sx = Math.sign(CENTER - px) || 1;
        const sy = Math.sign(py - CENTER) || -1;
        const square = 19;
        el.rightAngle.setAttribute(
          "d",
          `M ${footX + sx * square} ${footY} L ${footX + sx * square} ${footY + sy * square} L ${footX} ${footY + sy * square}`
        );

        const horizontalMid = { x: (CENTER + px) / 2, y: CENTER + (py < CENTER ? 25 : -25) };
        const verticalMid = { x: px + (px > CENTER ? 28 : -28), y: (CENTER + py) / 2 };
        const radiusMid = {
          x: (CENTER + px) / 2 + (py < CENTER ? -25 : 25),
          y: (CENTER + py) / 2 + (px > CENTER ? -20 : 20)
        };

        setBadge(el.horizontalBadge, horizontalMid.x, horizontalMid.y, ratio.x);
        setBadge(el.verticalBadge, verticalMid.x, verticalMid.y, ratio.y);
        setBadge(el.radiusBadge, radiusMid.x, radiusMid.y, ratio.r);
      }

      function setAngle(angle, scrollChip = false) {
        currentAngle = angle;
        renderAngleSelector();
        updateRatioDisplay();
        updateDiagram();

        if (scrollChip) {
          requestAnimationFrame(() => {
            el.angleSelector.querySelector(".active")?.scrollIntoView({
              behavior: "smooth",
              block: "nearest",
              inline: "center"
            });
          });
        }
      }

      function nearestAngle(rawAngle) {
        return ANGLES.reduce((best, angle) => (
          Math.abs(angle - rawAngle) < Math.abs(best - rawAngle) ? angle : best
        ), ANGLES[0]);
      }

      function angleFromPointer(event) {
        const point = el.circleSvg.createSVGPoint();
        point.x = event.clientX;
        point.y = event.clientY;
        const matrix = el.circleSvg.getScreenCTM();
        if (!matrix) return currentAngle;
        const local = point.matrixTransform(matrix.inverse());
        let degrees = Math.atan2(CENTER - local.y, local.x - CENTER) * 180 / Math.PI;
        if (degrees < 0) degrees += 360;
        return nearestAngle(degrees);
      }

      function beginDrag(event) {
        dragging = true;
        el.circleSvg.setPointerCapture?.(event.pointerId);
        setAngle(angleFromPointer(event));
        event.preventDefault();
      }

      function moveDrag(event) {
        if (!dragging) return;
        setAngle(angleFromPointer(event));
        event.preventDefault();
      }

      function endDrag(event) {
        dragging = false;
        if (el.circleSvg.hasPointerCapture?.(event.pointerId)) {
          el.circleSvg.releasePointerCapture(event.pointerId);
        }
      }

      function checkCurrent() {
        FUNCTIONS.forEach(fn => {
          const answerKey = key(currentAngle, fn);
          const value = answers[answerKey] || "";
          checked[answerKey] = value.trim() !== "" ? isCorrect(currentAngle, fn, value) : false;
        });
        renderCurrentInputs();
        renderTable();
        const correctCount = FUNCTIONS.filter(fn => checked[key(currentAngle, fn)] === true).length;
        el.checkMessage.className = `check-message ${correctCount === 3 ? "success" : "notice"}`;
        el.checkMessage.textContent = correctCount === 3
          ? `${angleText(currentAngle)}は全問正解です！`
          : `${angleText(currentAngle)}は ${correctCount} / 3 問正解です。`;
      }

      function checkAll() {
        let correctCount = 0;
        let filledCount = 0;
        ANGLES.forEach(angle => {
          FUNCTIONS.forEach(fn => {
            const answerKey = key(angle, fn);
            const value = answers[answerKey] || "";
            if (value.trim() !== "") {
              filledCount += 1;
              checked[answerKey] = isCorrect(angle, fn, value);
              if (checked[answerKey]) correctCount += 1;
            } else {
              delete checked[answerKey];
            }
          });
        });
        renderCurrentInputs();
        renderTable();
        const total = ANGLES.length * FUNCTIONS.length;
        if (correctCount === total) {
          el.checkMessage.className = "check-message success";
          el.checkMessage.textContent = `全${total}問正解です！表が完成しました。`;
        } else if (filledCount === 0) {
          el.checkMessage.className = "check-message notice";
          el.checkMessage.textContent = "まずは値を入力してみましょう。";
        } else {
          el.checkMessage.className = "check-message notice";
          el.checkMessage.textContent = `${filledCount}問中 ${correctCount}問正解です。赤い欄を見直しましょう。`;
        }
      }

      function showHint() {
        const data = DATA[currentAngle];
        const quadrant =
          currentAngle === 0 || currentAngle === 90 || currentAngle === 180 ||
          currentAngle === 270 || currentAngle === 360
            ? "軸上"
            : currentAngle < 90 ? "第1象限"
            : currentAngle < 180 ? "第2象限"
            : currentAngle < 270 ? "第3象限"
            : "第4象限";
        el.hintBox.innerHTML =
          `<strong>ヒント：</strong>点Pは${quadrant}です。` +
          `sinは <strong>y ÷ r</strong>、cosは <strong>x ÷ r</strong>、` +
          `tanは <strong>y ÷ x</strong>。x=${data.x}、y=${data.y} の符号に注目しましょう。`;
        el.hintBox.classList.toggle("show");
      }

      function revealCurrent() {
        FUNCTIONS.forEach(fn => {
          const answerKey = key(currentAngle, fn);
          answers[answerKey] = DATA[currentAngle][fn];
          checked[answerKey] = true;
        });
        saveAnswers();
        renderCurrentInputs();
        renderTable();
        updateProgress();
        el.checkMessage.className = "check-message";
        el.checkMessage.textContent = `${angleText(currentAngle)}の答えを表示しました。`;
      }

      function resetAll() {
        if (!window.confirm("入力した答えをすべて消します。よろしいですか？")) return;
        answers = {};
        checked = {};
        saveAnswers();
        renderCurrentInputs();
        renderTable();
        updateProgress();
        el.checkMessage.className = "check-message";
        el.checkMessage.textContent = "すべての入力を消しました。";
      }

      el.angleUnitButtons.forEach(button => {
        button.addEventListener("click", () => setAngleUnit(button.dataset.angleUnit));
      });

      el.circleSvg.addEventListener("pointerdown", beginDrag);
      el.circleSvg.addEventListener("pointermove", moveDrag);
      el.circleSvg.addEventListener("pointerup", endDrag);
      el.circleSvg.addEventListener("pointercancel", endDrag);

      el.pointGroup.addEventListener("keydown", event => {
        if (!["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown"].includes(event.key)) return;
        event.preventDefault();
        const index = ANGLES.indexOf(currentAngle);
        const direction = event.key === "ArrowLeft" || event.key === "ArrowDown" ? -1 : 1;
        const nextIndex = Math.max(0, Math.min(ANGLES.length - 1, index + direction));
        setAngle(ANGLES[nextIndex], true);
      });

      updateAngleUnitControls();
      setAngle(currentAngle);
    })();
  </script>
</body>
</html>
